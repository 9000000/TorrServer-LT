name: build

# Cross-compiles every non-macOS target on a single fast x86 ubuntu runner via
# the build/<target>.sh scripts — no Docker, no QEMU emulation, no MSYS2.
# macOS is built natively on macos runners in build-macos.yml.

on:
  pull_request:
    branches: [master]
  workflow_dispatch:
  workflow_call:
    inputs:
      version:
        type: string
        default: ''
      targets_json:
        type: string
        default: '["linux-amd64","linux-arm64","linux-armv7","windows-amd64","android-arm64","android-armv7"]'
      gstreamer:
        type: boolean
        default: true

jobs:
  sources:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - id: cache
        uses: actions/cache@v4
        with:
          path: _src
          key: src-boost1.85.0-lt2.1.0-ossl3.5.7-v1
      - name: Fetch Boost + libtorrent
        if: steps.cache.outputs.cache-hit != 'true'
        run: bash build/_fetch_sources.sh

  cross:
    needs: sources
    name: ${{ matrix.target }}
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        target: ${{ fromJson(inputs.targets_json) }}
    steps:
      - uses: actions/checkout@v4

      - name: Restore Boost + libtorrent sources
        uses: actions/cache@v4
        with:
          path: _src
          key: src-boost1.85.0-lt2.1.0-ossl3.5.7-v1

      - name: Cache libtorrent install tree
        uses: actions/cache@v4
        with:
          path: _deps/${{ matrix.target }}
          key: deps-${{ matrix.target }}-boost1.85.0-lt2.1.0-ossl3.5.7-v1

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: server/go.mod
          cache: true
          cache-dependency-path: server/go.sum

      - name: Install toolchain
        run: |
          set -euo pipefail
          case "${{ matrix.target }}" in
            linux-amd64)   : ;;  # host gcc/g++ already present
            linux-arm64)   sudo apt-get update -qq && sudo apt-get install -y g++-aarch64-linux-gnu ;;
            linux-armv7)   sudo apt-get update -qq && sudo apt-get install -y g++-arm-linux-gnueabihf ;;
            windows-amd64) sudo apt-get update -qq && sudo apt-get install -y g++-mingw-w64-x86-64 ;;
            android-*)     echo "ANDROID_NDK_HOME=$ANDROID_NDK_LATEST_HOME" >> "$GITHUB_ENV" ;;
          esac

      - name: Build
        env:
          TS_VERSION: ${{ inputs.version }}
          SKIP_GST: ${{ inputs.gstreamer == false && '1' || '0' }}
        run: bash build/${{ matrix.target }}.sh

      # Only linux-amd64 runs on the x86 host; use it as the test + smoke gate.
      - name: Unit tests
        if: matrix.target == 'linux-amd64'
        working-directory: server
        env:
          CGO_ENABLED: '1'
          PKG_CONFIG_PATH: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          PKG_CONFIG_LIBDIR: ${{ github.workspace }}/_deps/linux-amd64/lib/pkgconfig
          CGO_LDFLAGS: -L${{ github.workspace }}/_deps/linux-amd64/lib
        run: go test -count=1 -timeout 180s ./lt/ ./torr/ ./torr/storage/torrstor/ ./dlna/

      - name: Probe --version
        if: matrix.target == 'linux-amd64'
        run: |
          _out/TorrServer-LT-linux-amd64 --version
          _out/TorrServer-LT-linux-amd64-gst --version 2>/dev/null || true

      - uses: actions/upload-artifact@v4
        with:
          name: TorrServer-LT-${{ matrix.target }}
          path: _out/TorrServer-LT-${{ matrix.target }}*
          if-no-files-found: ignore

  docker:
    needs: cross
    if: github.event_name != 'pull_request' && (github.ref == 'refs/heads/master' || startsWith(github.ref, 'refs/tags/'))
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          pattern: TorrServer-LT-*
          path: dist
          merge-multiple: true

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract metadata (tags, labels)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository }}
          tags: |
            type=ref,event=branch
            type=ref,event=tag
            type=semver,pattern={{version}}
            type=sha,prefix=

      - name: Build and push runtime image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: Dockerfile.runtime
          platforms: linux/amd64,linux/arm64,linux/arm/v7
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
