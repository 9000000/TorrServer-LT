name: Release

on:
  push:
    tags:
      - "*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag name for release (e.g. v1.0.0 or MatriX.LT-002)"
        required: true
        default: "manual-build"
      build_all:
        description: "🔘 Build ALL platforms (override individual selections)"
        required: false
        type: boolean
        default: false
      linux_amd64:
        description: "🐧 Linux AMD64 (x86_64)"
        required: false
        type: boolean
        default: true
      linux_arm64:
        description: "🐧 Linux ARM64 (aarch64)"
        required: false
        type: boolean
        default: true
      linux_arm7:
        description: "🐧 Linux ARM7 (32-bit ARM)"
        required: false
        type: boolean
        default: false
      windows:
        description: "🪟 Windows (AMD64)"
        required: false
        type: boolean
        default: false
      macos:
        description: "🍎 macOS (AMD64 + ARM64)"
        required: false
        type: boolean
        default: false
      android_arm64:
        description: "🤖 Android ARM64 (aarch64)"
        required: false
        type: boolean
        default: true
      android_arm7:
        description: "🤖 Android ARM7 (32-bit)"
        required: false
        type: boolean
        default: true
      gstreamer:
        description: "🎥 GStreamer binaries (-gst-)"
        required: false
        type: boolean
        default: true

permissions:
  contents: write
  packages: write

jobs:
  matrix-prep:
    name: Prepare Dynamic Matrix
    runs-on: ubuntu-latest
    outputs:
      targets: ${{ steps.set-targets.outputs.targets }}
      build_macos: ${{ steps.set-targets.outputs.build_macos }}
      gstreamer: ${{ steps.set-targets.outputs.gstreamer }}
    steps:
      - id: set-targets
        run: |
          EVENT="${{ github.event_name }}"
          BUILD_ALL="${{ github.event.inputs.build_all }}"
          
          TARGETS=()
          
          if [[ "$EVENT" == "push" ]] || [[ "$BUILD_ALL" == "true" ]]; then
            TARGETS+=("linux-amd64" "linux-arm64" "linux-armv7" "windows-amd64" "android-arm64" "android-armv7")
            BUILD_MACOS="true"
            GSTREAMER="true"
          else
            [[ "${{ github.event.inputs.linux_amd64 }}" == "true" ]] && TARGETS+=("linux-amd64")
            [[ "${{ github.event.inputs.linux_arm64 }}" == "true" ]] && TARGETS+=("linux-arm64")
            [[ "${{ github.event.inputs.linux_arm7 }}" == "true" ]] && TARGETS+=("linux-arm7")
            [[ "${{ github.event.inputs.windows }}" == "true" ]] && TARGETS+=("windows-amd64")
            [[ "${{ github.event.inputs.android_arm64 }}" == "true" ]] && TARGETS+=("android-arm64")
            [[ "${{ github.event.inputs.android_arm7 }}" == "true" ]] && TARGETS+=("android-arm7")
            BUILD_MACOS="${{ github.event.inputs.macos }}"
            GSTREAMER="${{ github.event.inputs.gstreamer }}"
          fi

          JSON_TARGETS=$(jq -c -n '$ARGS.positional' --args "${TARGETS[@]}")
          echo "targets=$JSON_TARGETS" >> "$GITHUB_OUTPUT"
          echo "build_macos=$BUILD_MACOS" >> "$GITHUB_OUTPUT"
          echo "gstreamer=$GSTREAMER" >> "$GITHUB_OUTPUT"
          echo "Dynamic targets: $JSON_TARGETS"

  cross:
    needs: matrix-prep
    if: needs.matrix-prep.outputs.targets != '[]'
    uses: ./.github/workflows/build.yml
    with:
      version: ${{ github.event.inputs.tag_name || github.ref_name }}
      targets_json: ${{ needs.matrix-prep.outputs.targets }}
      gstreamer: ${{ needs.matrix-prep.outputs.gstreamer == 'true' }}

  macos:
    needs: matrix-prep
    if: needs.matrix-prep.outputs.build_macos == 'true'
    uses: ./.github/workflows/build-macos.yml
    with:
      version: ${{ github.event.inputs.tag_name || github.ref_name }}

  release:
    needs: [matrix-prep, cross, macos]
    if: always() && (startsWith(github.ref, 'refs/tags/') || github.event_name == 'workflow_dispatch')
    runs-on: ubuntu-latest
    steps:
      - name: Download binary artifacts
        uses: actions/download-artifact@v4
        with:
          pattern: TorrServer-LT-*
          path: ./dist
          merge-multiple: true

      - name: List release assets
        run: |
          echo "========================================="
          echo "  Release Assets"
          echo "========================================="
          ls -lhR ./dist || echo "No dist files"
          echo "========================================="

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: ./dist/*
          generate_release_notes: true
          draft: false
          prerelease: false
          tag_name: ${{ github.event.inputs.tag_name || github.ref_name }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
